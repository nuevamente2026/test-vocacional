<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocational &amp; Personality Exploration Test</title>
<style>
  :root {
    --bg:#FAFAF8;--surface:#FFFFFF;--border:#E4E2DC;--border-soft:#F0EEE8;
    --text-primary:#1A1A18;--text-secondary:#5C5C56;--text-tertiary:#9A9A92;
    --accent-purple:#5B52C8;--accent-purple-light:#EEEDFB;
    --accent-green:#1A8C68;--accent-green-light:#E2F4ED;
    --accent-amber:#C47B0A;--accent-amber-light:#FEF3DC;
    --accent-teal:#1A7A8C;--accent-teal-light:#E2F2F4;
    --riasec-r:#4A8B3F;--riasec-i:#5B52C8;--riasec-a:#C24D7A;
    --riasec-s:#1A8C68;--riasec-e:#C85228;--riasec-c:#2E6DB4;
    --b5-e:#5B52C8;--b5-o:#C24D7A;--b5-a:#1A8C68;--b5-c:#2E6DB4;--b5-n:#C85228;
    --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;line-height:1.6}
  .page{max-width:680px;margin:0 auto;padding:24px 20px 80px}
  .header{text-align:center;padding:40px 0 32px;border-bottom:1px solid var(--border);margin-bottom:32px}
  .header-eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:10px}
  .header-title{font-size:22px;font-weight:700;color:var(--text-primary);line-height:1.3;margin-bottom:6px}
  .header-subtitle{font-size:13px;color:var(--text-secondary);font-style:italic}
  .lang-toggle{display:flex;gap:8px;justify-content:center;margin-bottom:28px}
  .lang-btn{padding:6px 18px;border:1.5px solid var(--border);border-radius:99px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;color:var(--text-secondary);transition:all .15s}
  .lang-btn.active{background:var(--accent-purple);border-color:var(--accent-purple);color:#fff}
  .screen{display:none}.screen.active{display:block}
  .intro-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:20px;box-shadow:var(--shadow)}
  .intro-lead{font-size:15px;color:var(--text-primary);line-height:1.7;margin-bottom:20px}
  .phases{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
  .phase-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px}
  .phase-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-bottom:6px}
  .badge-r{background:var(--accent-purple-light);color:var(--accent-purple)}
  .badge-b{background:var(--accent-green-light);color:var(--accent-green)}
  .badge-t{background:var(--accent-teal-light);color:var(--accent-teal)}
  .phase-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px}
  .phase-sub{font-size:11px;color:var(--text-secondary)}
  .intro-note{font-size:13px;color:var(--text-secondary);line-height:1.6}
  .progress-wrap{margin-bottom:24px}
  .progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .section-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px}
  .section-badge.riasec{background:var(--accent-purple-light);color:var(--accent-purple)}
  .section-badge.big5{background:var(--accent-green-light);color:var(--accent-green)}
  .section-badge.refine{background:var(--accent-teal-light);color:var(--accent-teal)}
  .q-counter{font-size:12px;color:var(--text-tertiary);font-weight:500}
  .progress-track{height:4px;background:var(--border);border-radius:99px;overflow:hidden}
  .progress-fill{height:4px;background:linear-gradient(90deg,var(--accent-purple),var(--accent-green),var(--accent-teal));border-radius:99px;transition:width .4s ease}
  .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:20px;box-shadow:var(--shadow)}
  .q-instruction{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:12px}
  .q-text{font-size:15px;color:var(--text-secondary);margin-bottom:20px;line-height:1.6}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.choice-grid{grid-template-columns:1fr}}
  .choice-btn{padding:16px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--surface);cursor:pointer;text-align:left;font-size:14px;color:var(--text-primary);line-height:1.5;transition:all .15s}
  .choice-btn:hover{background:var(--bg);border-color:var(--accent-purple)}
  .choice-btn.selected{background:var(--accent-purple-light);border-color:var(--accent-purple);color:var(--accent-purple);font-weight:500}
  .choice-btn.refine-btn:hover{border-color:var(--accent-teal)}
  .choice-btn.refine-btn.selected{background:var(--accent-teal-light);border-color:var(--accent-teal);color:var(--accent-teal)}
  .choice-letter{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:6px}
  .choice-btn.selected .choice-letter{color:var(--accent-purple);opacity:.7}
  .choice-btn.refine-btn.selected .choice-letter{color:var(--accent-teal);opacity:.7}
  .likert-endpoints{display:flex;justify-content:space-between;font-size:11px;color:var(--text-tertiary);margin-bottom:10px;padding:0 2px}
  .likert-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .likert-btn{padding:12px 4px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--surface);cursor:pointer;text-align:center;font-size:16px;font-weight:600;color:var(--text-secondary);transition:all .15s;line-height:1}
  .likert-btn:hover{background:var(--bg);border-color:var(--accent-green)}
  .likert-btn.selected{background:var(--accent-green-light);border-color:var(--accent-green);color:var(--accent-green)}
  .nav-row{display:flex;justify-content:flex-end;align-items:center;gap:12px}
  .btn{padding:12px 28px;border-radius:var(--radius-md);font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
  .btn-primary{background:var(--accent-purple);color:#fff;border-color:var(--accent-purple)}
  .btn-primary:hover{background:#4840A8;border-color:#4840A8}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-outline{background:var(--surface);color:var(--text-primary);border-color:var(--border)}
  .btn-outline:hover{background:var(--bg)}
  .results-header{text-align:center;padding:32px 0 24px;border-bottom:1px solid var(--border);margin-bottom:28px}
  .results-title{font-size:22px;font-weight:700;margin-bottom:6px}
  .results-sub{font-size:14px;color:var(--text-secondary)}
  .disclaimer-box{background:var(--accent-amber-light);border:1px solid var(--accent-amber);border-radius:var(--radius-md);padding:14px 18px;font-size:13px;color:var(--text-secondary);line-height:1.65;margin-bottom:24px}
  .result-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
  .result-block.refined{border-color:var(--accent-teal);background:var(--accent-teal-light)}
  .result-block-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:16px}
  .result-block.refined .result-block-title{color:var(--accent-teal)}
  .holland-code{font-size:42px;font-weight:800;letter-spacing:.12em;color:var(--accent-purple);margin-bottom:4px}
  .holland-label{font-size:13px;color:var(--text-secondary);margin-bottom:6px}
  .tie-note{font-size:13px;color:var(--text-secondary);font-style:italic;margin-bottom:16px;line-height:1.5;padding:8px 12px;background:var(--bg);border-radius:var(--radius-sm);border-left:3px solid var(--accent-amber)}
  .bar-row{margin-bottom:12px}
  .bar-meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .bar-meta-name{font-weight:600;color:var(--text-primary)}
  .bar-meta-val{color:var(--text-secondary);font-weight:500}
  .bar-track{height:8px;background:var(--border-soft);border-radius:99px;overflow:hidden}
  .bar-fill{height:8px;border-radius:99px;transition:width 1s ease}
  .profile-text{background:var(--bg);border-radius:var(--radius-md);padding:16px 18px;font-size:14px;color:var(--text-primary);line-height:1.75;margin-top:16px;border-left:3px solid var(--accent-purple)}
  .profile-text.green{border-left-color:var(--accent-green)}
  .careers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
  .career-pill{padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-primary);text-align:center;background:var(--bg)}
  .career-pill.refined{background:white;border-color:var(--accent-teal);color:var(--accent-teal);font-weight:500}
  .divider{height:1px;background:var(--border);margin:8px 0 24px}
  .restart-row{text-align:center;padding:16px 0 0}
  .refine-intro{background:var(--accent-teal-light);border:1px solid var(--accent-teal);border-radius:var(--radius-md);padding:14px 18px;font-size:13px;color:var(--accent-teal);line-height:1.6;margin-bottom:16px;display:none}
  .refine-intro.visible{display:block}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-eyebrow" id="hdr-eyebrow">Chapter 4</div>
    <div class="header-title" id="hdr-title">Vocational &amp; Personality Exploration Test</div>
    <div class="header-subtitle" id="hdr-sub">Based on the RIASEC and Big Five models</div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')">English</button>
    <button class="lang-btn" onclick="setLang('es')">Español</button>
  </div>
  <div id="screen-intro" class="screen active">
    <div class="intro-card">
      <p class="intro-lead" id="intro-lead"></p>
      <div class="phases">
        <div class="phase-card"><span class="phase-badge badge-r" id="p1-badge"></span><div class="phase-name" id="p1-name"></div><div class="phase-sub" id="p1-sub"></div></div>
        <div class="phase-card"><span class="phase-badge badge-b" id="p2-badge"></span><div class="phase-name" id="p2-name"></div><div class="phase-sub" id="p2-sub"></div></div>
        <div class="phase-card"><span class="phase-badge badge-t" id="p3-badge"></span><div class="phase-name" id="p3-name"></div><div class="phase-sub" id="p3-sub"></div></div>
      </div>
      <p class="intro-note" id="intro-note"></p>
    </div>
    <div style="text-align:center"><button class="btn btn-primary" onclick="startTest()" id="btn-start" style="padding:14px 40px;font-size:15px"></button></div>
  </div>
  <div id="screen-q" class="screen">
    <div class="progress-wrap">
      <div class="progress-header"><span class="section-badge riasec" id="section-badge"></span><span class="q-counter" id="q-counter"></span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="refine-intro" id="refine-intro"></div>
    <div class="q-card">
      <div class="q-instruction" id="q-instruction"></div>
      <div class="q-text" id="q-text"></div>
      <div id="q-input"></div>
    </div>
    <div class="nav-row"><button class="btn btn-primary" id="btn-next" onclick="nextQ()" disabled></button></div>
  </div>
  <div id="screen-results" class="screen">
    <div class="results-header"><div class="results-title" id="r-title"></div><div class="results-sub" id="r-sub"></div></div>
    <div class="disclaimer-box" id="r-disclaimer"></div>
    <div class="result-block">
      <div class="result-block-title" id="r-riasec-label"></div>
      <div class="holland-code" id="r-code"></div>
      <div class="holland-label" id="r-code-label"></div>
      <p class="tie-note" id="r-tie-note" style="display:none"></p>
      <div id="r-riasec-bars"></div>
      <div class="profile-text" id="r-riasec-desc"></div>
    </div>
    <div class="divider"></div>
    <div class="result-block">
      <div class="result-block-title" id="r-b5-label"></div>
      <div id="r-b5-bars"></div>
      <div class="profile-text green" id="r-b5-desc"></div>
    </div>
    <div class="divider"></div>
    <div class="result-block">
      <div class="result-block-title" id="r-careers-label"></div>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:4px" id="r-careers-sub"></p>
      <div class="careers-grid" id="r-careers-grid"></div>
    </div>
    <div class="divider"></div>
    <div class="result-block refined" id="r-refined-block" style="display:none">
      <div class="result-block-title" id="r-refined-label"></div>
      <p style="font-size:13px;color:var(--accent-teal);margin-bottom:4px" id="r-refined-sub"></p>
      <div class="careers-grid" id="r-refined-grid"></div>
    </div>
    <div class="divider"></div>
    <div class="result-block">
      <div class="result-block-title" id="r-profile-label"></div>
      <div class="profile-text" id="r-profile-text"></div>
    </div>
    <div class="restart-row"><button class="btn btn-outline" onclick="restart()" id="btn-restart"></button></div>
  </div>
</div>
<script>
var lang='en',currentQ=0,answers={};
var TRQ=30,TBQ=25,TRF=8,TOTAL=63;

// RIASEC 30 — balanced (C=Conventional here)
var RQ=[
{en:['Build a wooden bookshelf from scratch','Study the chemistry behind everyday reactions'],es:['Construir una estantería de madera desde cero','Estudiar las reacciones químicas de los objetos cotidianos'],c:['R','I']},
{en:['Create a simple app or website to solve a problem you have noticed in your school or neighborhood','Install or repair the electrical wiring and equipment in a room or for a school event'],es:['Crear una aplicación o sitio web sencillo para resolver un problema que has notado en tu colegio o barrio','Instalar o reparar el cableado eléctrico y los equipos en un espacio o para un evento escolar'],c:['I','R']},
{en:['Install electrical wiring in a new room','Write an original short story'],es:['Instalar el cableado eléctrico en una habitación','Escribir un cuento original'],c:['R','A']},
{en:['Design the interface and user experience of a mobile app or website','Repair a broken appliance at home'],es:['Diseñar la interfaz y experiencia de usuario de una aplicación móvil o sitio web','Reparar un electrodoméstico averiado en casa'],c:['A','R']},
{en:['Work outdoors restoring a hiking trail','Tutor younger students in math'],es:['Trabajar al aire libre restaurando un sendero de montaña','Dar clases de apoyo de matemáticas a estudiantes menores'],c:['R','S']},
{en:['Organize activities to help new students settle in at school','Assemble a piece of furniture from technical instructions'],es:['Organizar actividades para ayudar a nuevos estudiantes a integrarse en la escuela','Armar muebles siguiendo instrucciones técnicas'],c:['S','R']},
{en:['Operate machinery on a construction site','Pitch a business idea to a group of investors'],es:['Operar maquinaria en una obra de construcción','Presentar una idea de negocio ante un grupo de inversores'],c:['R','E']},
{en:['Lead a team to finish a project under pressure','Repair a car engine step by step'],es:['Liderar un equipo para terminar un proyecto bajo presión','Reparar el motor de un coche paso a paso'],c:['E','R']},
{en:['Install and configure solar panels or other renewable energy equipment','Organize and manage the official files, records, and schedules for a school or community organization'],es:['Instalar y configurar paneles solares u otros equipos de energía renovable','Organizar y gestionar los archivos, registros y cronogramas oficiales de un colegio u organización comunitaria'],c:['R','C']},
{en:["Keep and update a detailed record of a project's tasks, expenses, and progress",'Build a working model or prototype using 3D printing, carpentry, or other hands-on materials'],es:['Llevar y actualizar el registro detallado de las tareas, gastos y avances de un proyecto','Construir una maqueta funcional o prototipo usando impresión 3D, carpintería u otros materiales prácticos'],c:['C','R']},
{en:['Study how human memory works','Compose an original song or melody'],es:['Estudiar cómo funciona la memoria humana','Componer una canción o melodía original'],c:['I','A']},
{en:['Illustrate a graphic novel','Research the causes of climate change'],es:['Ilustrar una novela gráfica','Investigar las causas del cambio climático'],c:['A','I']},
{en:['Investigate patterns in public health data','Facilitate a group support session for students'],es:['Investigar patrones en datos de salud pública','Facilitar una sesión de apoyo grupal para estudiantes'],c:['I','S']},
{en:['Help coordinate a mental health awareness campaign','Analyze the results of a biology experiment'],es:['Ayudar a coordinar una campaña de concienciación sobre salud mental','Analizar los resultados de un experimento de biología'],c:['S','I']},
{en:['Research market trends to support a business decision','Launch a new product line for a company'],es:['Investigar tendencias del mercado para apoyar una decisión de negocio','Lanzar una nueva línea de productos para una empresa'],c:['I','E']},
{en:['Develop a strategy to grow a small business','Conduct a scientific investigation in a lab'],es:['Desarrollar una estrategia para hacer crecer un pequeño negocio','Realizar una investigación científica en un laboratorio'],c:['E','I']},
{en:['Research how hackers find weaknesses in apps and websites, and how those weaknesses can be fixed','Organize and maintain the complete records, inventory, and official documentation of a school club or organization'],es:['Investigar cómo los hackers encuentran vulnerabilidades en apps y sitios web, y cómo pueden corregirse','Organizar y mantener los registros completos, el inventario y la documentación oficial de un club u organización escolar'],c:['I','C']},
{en:['Keep and update a detailed spreadsheet with the budget, expenses, and results of a school project','Investigate a trend that interests you by collecting real information and looking for patterns that explain it'],es:['Llevar y actualizar una hoja de cálculo con el presupuesto, gastos y resultados de un proyecto escolar','Investigar una tendencia que te genera curiosidad recopilando información real y buscando los patrones que la explican'],c:['C','I']},
{en:['Design the visual identity for a community festival','Guide students who are struggling with academic stress'],es:['Diseñar la identidad visual de un festival comunitario','Orientar a estudiantes que enfrentan estrés académico'],c:['A','S']},
{en:['Coordinate a volunteer program for elderly residents',"Create illustrations for a children's book"],es:['Coordinar un programa de voluntariado para personas mayores','Crear ilustraciones para un libro infantil'],c:['S','A']},
{en:['Direct and produce a short documentary film','Negotiate a sponsorship deal for a local event'],es:['Dirigir y producir un cortometraje documental','Negociar un acuerdo de patrocinio para un evento local'],c:['A','E']},
{en:['Develop a brand identity and marketing campaign','Design a mural for a public space'],es:['Desarrollar la identidad de marca y campaña de marketing de un producto','Diseñar un mural para un espacio público'],c:['E','A']},
{en:['Write a screenplay for a theater production','Review and edit documents for errors and clarity'],es:['Escribir el guion de una obra de teatro','Revisar y corregir documentos en busca de errores'],c:['A','C']},
{en:["Organize and catalog a museum's collection",'Photograph and curate images for an exhibition'],es:['Organizar y catalogar la colección de un museo','Fotografiar y curar imágenes para una exposición'],c:['C','A']},
{en:['Run workshops for young people in a community center','Lead a fundraising campaign for a local cause'],es:['Coordinar talleres para jóvenes en un centro comunitario','Liderar una campaña de recaudación de fondos para una causa local'],c:['S','E']},
{en:['Manage and motivate a team of volunteers','Support families navigating a community health challenge'],es:['Gestionar y motivar a un equipo de voluntarios','Apoyar a familias que atraviesan una situación de salud comunitaria'],c:['E','S']},
{en:['Teach conflict-resolution skills to a group of students','Process and manage administrative records for a school'],es:['Enseñar habilidades de resolución de conflictos a estudiantes','Procesar y gestionar los registros administrativos de una escuela'],c:['S','C']},
{en:['Organize the schedule and paperwork for a school club','Coordinate a buddy system for students new to your school'],es:['Organizar el calendario y los registros de un club escolar','Coordinar un sistema de acompañamiento para estudiantes nuevos en tu colegio'],c:['C','S']},
{en:['Develop and present a startup business plan','Follow established accounting procedures to prepare financial reports'],es:['Desarrollar y presentar un plan de negocio para una startup','Seguir procedimientos contables establecidos para preparar informes financieros'],c:['E','C']},
{en:['Keep track of expenses and organize the records for a school event','Create and pitch a plan to promote a product or event at school'],es:['Llevar el registro de gastos y organizar los documentos de un evento escolar','Crear y presentar un plan para promocionar un producto o evento en el colegio'],c:['C','E']}
];

// BIG FIVE 25 — (C=Conscientiousness here)
var BQ=[
{en:'When I am in a group, I often end up leading conversations or suggesting what to do.',es:'Cuando estoy en un grupo, suelo terminar liderando las conversaciones o sugiriendo qué hacer.',t:'E',r:false},
{en:'I feel energized after spending time with large groups of people.',es:'Me siento con energía después de pasar tiempo con grupos grandes de personas.',t:'E',r:false},
{en:'I prefer quiet evenings at home over busy social gatherings.',es:'Prefiero noches tranquilas en casa antes que reuniones sociales animadas.',t:'E',r:true},
{en:'At social events, I find it easy to start conversations with people I have never met.',es:'En eventos sociales, me resulta fácil iniciar conversaciones con personas que no conozco.',t:'E',r:false},
{en:'In most social situations, I prefer to let others take center stage.',es:'En la mayoría de situaciones sociales, prefiero dejar que otros sean el centro de atención.',t:'E',r:true},
{en:'I enjoy exploring ideas that have no immediate practical use — just for the pleasure of understanding them.',es:'Disfruto explorando ideas sin aplicación práctica inmediata — solo por el placer de entenderlas.',t:'O',r:false},
{en:'I enjoy exploring creative and artistic experiences.',es:'Disfruto explorar experiencias creativas y artísticas.',t:'O',r:false},

CR:['Ingeniería Eléctrica','Ingeniería Mecánica','Mantenimiento Industrial','Control de Calidad','Logística'],
AC:['Diseño UX','Editorial','Producción Musical','Redacción Técnica','Bibliotecología'],
CA:['Diseño UX','Editorial','Producción Musical','Redacción Técnica','Bibliotecología'],
SC:['Enfermería','Administración Pública','Educación','Administración de Salud','Política Social'],
CS:['Enfermería','Administración Pública','Educación','Administración de Salud','Política Social'],
DEFAULT:['Educación','Salud','Negocios','Tecnología','Artes y Cultura']
}};

// REFINEMENT TAGS (unchanged tags, RF1&RF7 questions updated above)
var RF_TAGS={
en:[
[['Psychology','Counseling','Social Work','Educational Guidance'],['Medicine','Nursing','Dentistry','Physical Therapy']],
[['Biology','Medicine','Biotechnology','Genetics'],['Computer Science','Data Science','Software Engineering','Artificial Intelligence']],
[['Graphic Design','UX Design','Visual Arts','Architecture'],['Journalism','Creative Writing','Film','Communication']],
[['Electrical Engineering','Electronics','Renewable Energy Technology'],['Civil Engineering','Mechanical Engineering','Construction']],
[['Entrepreneurship','Business Administration','Marketing'],['Law','Political Science','Public Policy']],
[['Software Engineering','App Development','Web Development'],['Cybersecurity','Network Security','Information Security']],
[['Medicine','Biology','Public Health','Genetics'],['Physics','Chemistry','Mathematics','Engineering']],
[['Accounting','Finance','Auditing','Economics'],['Business Administration','Human Resources','Operations Management']]
],
es:[
[['Psicología','Consejería','Trabajo Social','Orientación Educativa'],['Medicina','Enfermería','Odontología','Fisioterapia']],
[['Biología','Medicina','Biotecnología','Genética'],['Informática','Ciencia de Datos','Ingeniería de Software','Inteligencia Artificial']],
[['Diseño Gráfico','Diseño UX','Artes Visuales','Arquitectura'],['Periodismo','Escritura Creativa','Cine','Comunicación']],
[['Ingeniería Eléctrica','Electrónica','Tecnología de Energía Renovable'],['Ingeniería Civil','Ingeniería Mecánica','Construcción']],
[['Emprendimiento','Administración de Empresas','Marketing'],['Derecho','Ciencias Políticas','Políticas Públicas']],
[['Ingeniería de Software','Desarrollo de Apps','Desarrollo Web'],['Ciberseguridad','Seguridad de Redes','Seguridad Informática']],
[['Medicina','Biología','Salud Pública','Genética'],['Física','Química','Matemáticas','Ingeniería']],
[['Contabilidad','Finanzas','Auditoría','Economía'],['Administración de Empresas','Recursos Humanos','Gestión de Operaciones']]
]};

// Which RF questions apply to each RIASEC top-2 pair
var PAIR_RF={
RI:[3,5,6],IR:[3,5,6],IA:[0,1,6],AI:[0,1,6],IS:[0,6],SI:[0,6],IE:[4],EI:[4],
IC:[1,5,7],CI:[1,5,7],AS:[2,0],SA:[2,0],AE:[2,4],EA:[2,4],SE:[4,0],ES:[4,0],
EC:[4,7],CE:[4,7],RA:[3,2],AR:[3,2],RS:[0,3],SR:[0,3],RE:[3,4],ER:[3,4],
RC:[3,1],CR:[3,1],AC:[2,5],CA:[2,5],SC:[0,4],CS:[0,4]
};

// Colors (RIASEC C = riasec-c, Big5 C = b5-c, separate objects)
var RCOLORS={R:'var(--riasec-r)',I:'var(--riasec-i)',A:'var(--riasec-a)',S:'var(--riasec-s)',E:'var(--riasec-e)',C:'var(--riasec-c)'};
var B5COLORS={E:'var(--b5-e)',O:'var(--b5-o)',A:'var(--b5-a)',C:'var(--b5-c)',N:'var(--b5-n)'};

// Big Five helpers — 5-level scale (0-100, step 5, verified exact range)
function getB5Level(pct){
  if(pct<=20)return 'vl';if(pct<=40)return 'lo';if(pct<=60)return 'mo';if(pct<=80)return 'hi';return 'vh';
}
function getB5CatLabel(pct,l){
  var cats=T[l].b5Cats;
  if(pct<=20)return cats[0];if(pct<=40)return cats[1];if(pct<=60)return cats[2];if(pct<=80)return cats[3];return cats[4];
}

// Refinement — scoring system (1 point per career per relevant RF answer)
function getRefinedCareers(sortedR,rfAnswers,l){
  var pair=sortedR[0]+sortedR[1];
  var relevant=PAIR_RF[pair]||[];
  var scores={},order=[];
  relevant.forEach(function(rfIdx){
    var a=rfAnswers[rfIdx];
    if(a!==undefined){
      RF_TAGS[l][rfIdx][a].forEach(function(career){
        if(scores[career]===undefined){scores[career]=0;order.push(career);}
        scores[career]++;
      });
    }
  });
  // Stable sort: higher score first, insertion order for ties
  var indexed=order.map(function(c,i){return{c:c,s:scores[c],i:i};});
  indexed.sort(function(a,b){return b.s!==a.s?b.s-a.s:a.i-b.i;});
  return indexed.slice(0,5).map(function(x){return x.c;});
}

// Language
function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active',(l==='en'&&b.textContent==='English')||(l==='es'&&b.textContent==='Español'));
  });
  applyLang();
}
function applyLang(){
  var t=T[lang];
  var ids={
    'hdr-eyebrow':t.hdrEyebrow,'hdr-title':t.hdrTitle,'hdr-sub':t.hdrSub,
    'intro-lead':t.introLead,'intro-note':t.introNote,
    'p1-badge':t.p1Badge,'p1-name':t.p1Name,'p1-sub':t.p1Sub,
    'p2-badge':t.p2Badge,'p2-name':t.p2Name,'p2-sub':t.p2Sub,
    'p3-badge':t.p3Badge,'p3-name':t.p3Name,'p3-sub':t.p3Sub,
    'btn-start':t.btnStart,'btn-next':t.btnNext
  };
  for(var id in ids){var el=document.getElementById(id);if(el)el.textContent=ids[id];}
  var br=document.getElementById('btn-restart');if(br)br.textContent=t.btnRestart;
  if(document.getElementById('screen-q').classList.contains('active'))renderQ();
  if(document.getElementById('screen-results').classList.contains('active'))renderResults();
}

// Flow
function startTest(){
  document.getElementById('screen-intro').classList.remove('active');
  document.getElementById('screen-q').classList.add('active');
  currentQ=0;answers={};renderQ();
}

function renderQ(){
  var t=T[lang];
  document.getElementById('progress-fill').style.width=Math.round((currentQ/TOTAL)*100)+'%';
  var cur=answers[currentQ];
  var isR=currentQ<TRQ,isB=currentQ>=TRQ&&currentQ<TRQ+TBQ,isRF=currentQ>=TRQ+TBQ;
  var badge=document.getElementById('section-badge');
  var ri=document.getElementById('refine-intro');
  if(isR){badge.textContent=t.badgeR;badge.className='section-badge riasec';ri.classList.remove('visible');}
  else if(isB){badge.textContent=t.badgeB;badge.className='section-badge big5';ri.classList.remove('visible');}
  else{badge.textContent=t.badgeRF;badge.className='section-badge refine';
    if(currentQ===TRQ+TBQ){ri.textContent=t.refineIntro;ri.classList.add('visible');}
    else{ri.classList.remove('visible');}
  }
  document.getElementById('q-counter').textContent=(currentQ+1)+' '+t.of+' '+TOTAL;
  document.getElementById('btn-next').textContent=t.btnNext;
  if(isR){
    var q=RQ[currentQ];
    document.getElementById('q-instruction').textContent=t.instructFC;
    document.getElementById('q-text').textContent='';
    document.getElementById('q-input').innerHTML='<div class="choice-grid">'+
      '<button class="choice-btn'+(cur===0?' selected':'')+'" onclick="pick(0)"><span class="choice-letter">A</span>'+q[lang][0]+'</button>'+
      '<button class="choice-btn'+(cur===1?' selected':'')+'" onclick="pick(1)"><span class="choice-letter">B</span>'+q[lang][1]+'</button>'+
    '</div>';
  }else if(isB){
    var qi=currentQ-TRQ,q=BQ[qi];
    document.getElementById('q-instruction').textContent=t.instructLK;
    document.getElementById('q-text').textContent=q[lang];
    var html='<div class="likert-endpoints"><span>'+t.likertLabels[0]+'</span><span>'+t.likertLabels[4]+'</span></div><div class="likert-grid">';
    for(var i=1;i<=5;i++)html+='<button class="likert-btn'+(cur===i?' selected':'')+'" onclick="pick('+i+')">'+i+'</button>';
    html+='</div>';
    document.getElementById('q-input').innerHTML=html;
  }else{
    var rfi=currentQ-TRQ-TBQ,q=RFQ[rfi];
    document.getElementById('q-instruction').textContent=t.instructRF;
    document.getElementById('q-text').textContent=q[lang==='es'?'es_q':'en_q'];
    document.getElementById('q-input').innerHTML='<div class="choice-grid">'+
      '<button class="choice-btn refine-btn'+(cur===0?' selected':'')+'" onclick="pick(0)"><span class="choice-letter">A</span>'+q[lang][0]+'</button>'+
      '<button class="choice-btn refine-btn'+(cur===1?' selected':'')+'" onclick="pick(1)"><span class="choice-letter">B</span>'+q[lang][1]+'</button>'+
    '</div>';
  }
  document.getElementById('btn-next').disabled=(cur===undefined);
}

function pick(val){answers[currentQ]=val;document.getElementById('btn-next').disabled=false;renderQ();}
function nextQ(){if(answers[currentQ]===undefined)return;currentQ++;if(currentQ>=TOTAL){showResults();return;}renderQ();}

function showResults(){
  document.getElementById('screen-q').classList.remove('active');
  document.getElementById('screen-results').classList.add('active');
  renderResults();
}

function renderResults(){
  var t=T[lang];
  var ids2={
    'r-title':t.rTitle,'r-sub':t.rSub,'r-disclaimer':t.rDisclaimer,
    'r-riasec-label':t.rRiasecLabel,'r-code-label':t.rCodeLabel,
    'r-b5-label':t.rB5Label,'r-careers-label':t.rCareersLabel,'r-careers-sub':t.rCareersSub,
    'r-refined-label':t.rRefinedLabel,'r-refined-sub':t.rRefinedSub,
    'r-profile-label':t.rProfileLabel,'btn-restart':t.btnRestart
  };
  for(var id in ids2){var el=document.getElementById(id);if(el)el.textContent=ids2[id];}

  // ── RIASEC scores (C = Conventional) ──
  var rs={R:0,I:0,A:0,S:0,E:0,C:0};
  for(var i=0;i<TRQ;i++){if(answers[i]!==undefined)rs[RQ[i].c[answers[i]]]++;}
  var allDims=['R','I','A','S','E','C'];
  var sortedR=allDims.slice().sort(function(a,b){return rs[b]-rs[a];});
  var maxR=Math.max.apply(null,allDims.map(function(d){return rs[d];}))||1;

  // Tie detection at 3rd position
  var thirdScore=rs[sortedR[2]];
  var tiedAtThird=sortedR.slice(2).filter(function(d){return rs[d]===thirdScore;});
  var hasTie=tiedAtThird.length>1;

  // Holland code display
  var codeDisplay=hasTie?sortedR[0]+sortedR[1]:sortedR[0]+sortedR[1]+sortedR[2];
  document.getElementById('r-code').textContent=codeDisplay;

  // Tie note
  var tieEl=document.getElementById('r-tie-note');
  if(hasTie){
    var letters=tiedAtThird;
    var joined='';
    var conj=lang==='es'?' y ':' and ';
    if(letters.length===2){joined=letters[0]+conj+letters[1];}
    else{joined=letters.slice(0,-1).join(', ')+conj+letters[letters.length-1];}
    var msg=lang==='es'
      ?joined+' presentan el mismo nivel como tercera área de interés.'
      :joined+' show the same level as the third area of interest.';
    tieEl.textContent=msg;tieEl.style.display='block';
  }else{tieEl.style.display='none';}

  // RIASEC bars
  var rHtml='';
  sortedR.forEach(function(k){
    var bp=Math.round((rs[k]/maxR)*100);
    rHtml+='<div class="bar-row"><div class="bar-meta"><span class="bar-meta-name">'+t.rNames[k]+'</span><span class="bar-meta-val">'+rs[k]+'/10</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+bp+'%;background:'+RCOLORS[k]+'"></div></div></div>';
  });
  document.getElementById('r-riasec-bars').innerHTML=rHtml;
  document.getElementById('r-riasec-desc').textContent=RDESC[lang][sortedR[0]];

  // ── Big Five scores (C = Conscientiousness) ──
  var b5s={E:0,O:0,A:0,C:0,N:0},b5cnt={E:0,O:0,A:0,C:0,N:0};
  for(var i=0;i<TBQ;i++){
    var qi=TRQ+i,a=answers[qi];
    if(a!==undefined){var v=BQ[i].r?(6-a):a;b5s[BQ[i].t]+=v;b5cnt[BQ[i].t]++;}
  }
  var b5Keys=['E','O','A','C','N'],b5Html='',b5DescText='',b5Avgs={};
  b5Keys.forEach(function(k){
    var avg=b5cnt[k]>0?b5s[k]/b5cnt[k]:3;
    b5Avgs[k]=avg;
    var pct=Math.round(((avg-1)/4)*100);
    var catLabel=getB5CatLabel(pct,lang);
    var level=getB5Level(pct);
    var descKey=k+'_'+level;
    b5Html+='<div class="bar-row"><div class="bar-meta"><span class="bar-meta-name">'+t.b5Names[k]+'</span><span class="bar-meta-val">'+catLabel+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+B5COLORS[k]+'"></div></div></div>';
    b5DescText+=B5DESC[lang][descKey]+' ';
  });
  document.getElementById('r-b5-bars').innerHTML=b5Html;
  document.getElementById('r-b5-desc').textContent=b5DescText.trim();

  // Base careers (RIASEC only, no Big Five)
  var top2=sortedR[0]+sortedR[1];
  var careers=CM[lang][top2]||CM[lang]['DEFAULT'];
  document.getElementById('r-careers-grid').innerHTML=careers.map(function(c){return'<div class="career-pill">'+c+'</div>';}).join('');

  // Refined careers — scoring system
  var rfAnswers={};
  for(var i=0;i<TRF;i++){var qi=TRQ+TBQ+i;if(answers[qi]!==undefined)rfAnswers[i]=answers[qi];}
  var refined=getRefinedCareers(sortedR,rfAnswers,lang);
  var rb=document.getElementById('r-refined-block');
  if(refined.length>0){
    rb.style.display='block';
    document.getElementById('r-refined-grid').innerHTML=refined.map(function(c){return'<div class="career-pill refined">'+c+'</div>';}).join('');
  }else{rb.style.display='none';}

  // Combined profile (Big Five for self-knowledge only, not career determination)
  document.getElementById('r-profile-text').textContent=buildProfile(sortedR,b5Avgs);
}

function buildProfile(sortedR,b5Avgs){
  var t=T[lang],n=t.rNames;
  var r1=sortedR[0],r2=sortedR[1],r3=sortedR[2];
  var extro=b5Avgs.E>=3,open=b5Avgs.O>=3,agree=b5Avgs.A>=3,consc=b5Avgs.C>=3,stable=b5Avgs.N<3;
  if(lang==='es'){
    var p='Tus resultados sugieren una combinación de orientaciones '+n[r1].toLowerCase()+', '+n[r2].toLowerCase()+' y '+n[r3].toLowerCase()+'. ';
    p+=(extro?'Tiendes a ganar energía en situaciones sociales, lo que puede favorecerte en roles colaborativos. ':'Tiendes a sentirte más cómodo/a en entornos independientes o de grupos pequeños. ');
    p+=(open?'Tu apertura a nuevas ideas puede ser una ventaja en entornos que valoran la creatividad y la innovación. ':'Tu preferencia por lo conocido y estructurado puede ser un activo en roles que requieren precisión y consistencia. ');
    p+=(agree?'Tu tendencia a la cooperación puede hacerte valioso/a en roles de equipo y servicio. ':'Tu enfoque directo puede ser una fortaleza en la negociación y la toma de decisiones. ');
    p+=(consc?'Tu tendencia a la organización y el seguimiento de objetivos puede llevarte lejos en cualquier campo. ':'Tu flexibilidad puede ser un activo en entornos que requieren adaptación constante. ');
    p+=(stable?'Tu estabilidad emocional puede ser una ventaja en situaciones de alta presión. ':'Desarrollar estrategias de afrontamiento puede ayudarte a gestionar mejor las situaciones exigentes. ');
    p+='El Big Five ofrece información complementaria sobre tu estilo personal, no determina tus opciones profesionales. Explorar áreas que combinen tus orientaciones '+n[r1].toLowerCase()+' y '+n[r2].toLowerCase()+' puede ayudarte a encontrar caminos que se sientan significativos.';
    return p;
  }else{
    var p='Your results suggest a combination of '+n[r1]+', '+n[r2]+', and '+n[r3]+' orientations. ';
    p+=(extro?'You may tend to gain energy from social situations, which could work in your favor in collaborative roles. ':'You may tend to feel most comfortable in independent or small-group environments. ');
    p+=(open?'Your openness to new ideas may be an asset in environments that value creativity and innovation. ':'Your preference for familiar, structured approaches may be a strength in roles that require precision and consistency. ');
    p+=(agree?'Your tendency toward cooperation may make you valuable in team and service roles. ':'Your direct approach may be a strength in negotiation and decision-making. ');
    p+=(consc?'Your tendency toward organization and goal-setting may take you far in any field. ':'Your flexibility may be an asset in environments that require constant adaptation. ');
    p+=(stable?'Your emotional stability may be an advantage in high-pressure situations. ':'Developing coping strategies may help you navigate demanding situations more comfortably. ');
    p+='The Big Five offers complementary information about your personal style, not a professional prescription. Exploring areas that combine your '+n[r1]+' and '+n[r2]+' orientations may help you identify directions that feel meaningful.';
    return p;
  }
}

function restart(){currentQ=0;answers={};document.getElementById('screen-results').classList.remove('active');document.getElementById('screen-intro').classList.add('active');applyLang();}

// Init
applyLang();
